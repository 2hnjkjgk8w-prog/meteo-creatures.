<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#211638">
  <title>Météo des petites créatures</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #211638;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    .app {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }
    h1 {
      color: #e4c9ff;
      font-size: 27px;
    }
    .panel {
      padding: 24px;
      border: 2px solid #8f64c9;
      border-radius: 20px;
      background: #302148;
      box-shadow: 0 8px 30px #10091c80;
    }
    input {
      width: 100%;
      padding: 14px;
      border: 2px solid #a889d5;
      border-radius: 12px;
      background: #f8f2ff;
      color: #211638;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #a66bea;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    button:active {
      transform: scale(0.98);
    }
    .hidden {
      display: none !important;
    }
    #loveScreen {
      padding: 30px 18px;
      animation: appear 0.8s ease;
    }
    .love-title {
      font-size: clamp(30px, 8vw, 46px);
      line-height: 1.2;
      color: #f4dcff;
      text-shadow: 0 0 18px #bd75ff;
    }
    .heart {
      margin: 24px 0;
      color: #c084fc;
      font-size: clamp(110px, 35vw, 180px);
      line-height: 1;
      text-shadow:
        0 0 15px #c084fc,
        0 0 40px #9333ea,
        0 0 70px #7e22ce;
      animation: heartbeat 1.2s infinite;
    }
    .love-text {
      font-size: 20px;
      color: #ead7ff;
      line-height: 1.6;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.12); }
      30% { transform: scale(1); }
      45% { transform: scale(1.08); }
    }
    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(0.85);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
    .weather-placeholder {
      margin-top: 22px;
      color: #d9c8ed;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="app">
    <section id="weatherScreen">
      <h1>🌙 Météo des petites créatures</h1>
      <div class="panel">
        <p>🔎 Recherche une ville</p>
        <form id="searchForm">
          <input
            id="cityInput"
            type="text"
            placeholder="Nom de la ville..."
            autocomplete="off"
            aria-label="Nom de la ville"
          >
          <button type="submit">🔍 Chercher</button>
        </form>
        <div id="weatherResult" class="weather-placeholder">
          Entre une ville pour commencer ton aventure météo. ✨
        </div>
      </div>
    </section>
    <section id="loveScreen" class="panel hidden" aria-live="polite">
      <div class="love-title">Je t’aime<br>ma princesse</div>
      <div class="heart" aria-label="Gros cœur violet">💜</div>
      <p class="love-text">
        Tu es précieuse pour moi. 💕<br>
        Plein de bisous rien que pour toi.
      </p>
      <button id="backButton" type="button">
        🌙 Retour à la météo
      </button>
    </section>
  </main>
  <script>
    const searchForm = document.getElementById("searchForm");
    const cityInput = document.getElementById("cityInput");
    const weatherScreen = document.getElementById("weatherScreen");
    const loveScreen = document.getElementById("loveScreen");
    const weatherResult = document.getElementById("weatherResult");
    const backButton = document.getElementById("backButton");
    function normalizeSecret(value) {
      return value
        .toLocaleLowerCase("fr-FR")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9]/g, "");
    }
    function showLoveMessage() {
      weatherScreen.classList.add("hidden");
      loveScreen.classList.remove("hidden");
    }
    function showWeatherScreen() {
      loveScreen.classList.add("hidden");
      weatherScreen.classList.remove("hidden");
      cityInput.value = "";
      weatherResult.textContent =
        "Entre une ville pour commencer ton aventure météo. ✨";
    }
    searchForm.addEventListener("submit", function(event) {
      event.preventDefault();
      const typed = cityInput.value;
      if (normalizeSecret(typed) === "jetaimemonchaton") {
        showLoveMessage();
        return;
      }
      const city = typed.trim();
      if (!city) {
        weatherResult.textContent = "Écris le nom d’une ville ! 🌷";
        return;
      }
      weatherResult.textContent =
        "Tu as recherché : " + city +
        ". La météo doit être connectée à un service météo pour afficher les conditions réelles.";
    });
    backButton.addEventListener("click", showWeatherScreen);
  </script>
</body>
</html>
